services:
  - type: web
    name: secure-api-portal
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: secure-api-portal-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: UPSTREAM_URL
        sync: false
      - key: UPSTREAM_KEY
        sync: false
      - key: UPSTREAM_AUTH_HEADER
        value: Authorization
      - key: UPSTREAM_AUTH_SCHEME
        value: Bearer
      - key: UPSTREAM_ALLOWED_PARAMS
        value: id,type,page
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
databases:
  - name: secure-api-portal-db
    plan: basic-256mb
